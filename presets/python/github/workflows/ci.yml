name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # adjust to your project's supported Python version

      - name: Install tools and the project
        run: |
          python -m pip install --upgrade pip
          # Keep the ruff version in sync with .pre-commit-config.yaml.
          python -m pip install ruff==0.17.4 pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
