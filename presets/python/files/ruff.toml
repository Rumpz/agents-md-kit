# Ruff linter and formatter (https://docs.astral.sh/ruff/).
# Kept in its own file so agent-kit never edits pyproject.toml.
# target-version: when unset, Ruff infers it from `requires-python` in pyproject.toml.

line-length = 100
extend-exclude = ["build", "dist"]

[lint]
# E4/E7/E9/F: pyflakes + error-prone pycodestyle; W: warnings; I: import order;
# B: bugbear; UP: pyupgrade; S: bandit security; SIM: simplify; RUF: ruff-specific.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[format]
docstring-code-format = true
