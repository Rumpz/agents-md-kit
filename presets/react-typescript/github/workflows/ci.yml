name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # adjust to your project's supported Node version
          cache: npm

      - run: npm ci

      # Scripts are skipped if not defined (--if-present). Remove the flag once
      # your project defines them, so a missing script fails the build.
      - run: npm run lint --if-present
      - run: npm run format:check --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
